backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "cars"
    label: "Cars"
    folder: "data"
    create: true
    slug: "{{make}}-{{model}}-{{year}}"
    fields:
      - { label: "Make", name: "make", widget: "string" }
      - { label: "Model", name: "model", widget: "string" }
      - { label: "Year", name: "year", widget: "number" }
      - { label: "Price", name: "price", widget: "number" }
      - { label: "Mileage", name: "mileage", widget: "number" }
      - { label: "Body Style", name: "body", widget: "select", options: ["Sedan", "SUV", "Truck", "Coupe", "Convertible"] }
      - { label: "Drivetrain", name: "drivetrain", widget: "select", options: ["FWD", "RWD", "AWD"] }
      - { label: "Fuel Type", name: "fuel", widget: "select", options: ["Gasoline", "Hybrid", "Electric"] }
      - { label: "Color", name: "color", widget: "string" }
      - { label: "Dealer", name: "dealer", widget: "string", required: false }
      - { label: "Badge", name: "badge", widget: "select", options: ["new", "used", "cpo"] }
      - { label: "Image", name: "img", widget: "image" }
      - { label: "Description", name: "description", widget: "text", required: false }